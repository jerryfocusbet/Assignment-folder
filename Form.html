    <h2>Add Education Details</h2>
<!--form-->
    <form>
        <table>
            <tr>
                <td><label>Exact Title In Origina Language:</label></td>
                <td><input type="text"></option></td>
            </tr>
            <tr>
                <td><label>Title of the degree/Diploma in English<br>Or French Language e.g Bachelor in Law:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>  
                <td><label>Attended</label></td>
                <td>
                    <label>From</label>
                    <input type="month">
                    <label>To</label>
                    <input type="month">
                </td>
            </tr>
            <tr>
                <td><label>Degree/Diploma Obtained:</label></td>
                <td>
                    <label>Yes</label>
                    <input type="radio">
                    <label>No</label>
                    <input type="radio">
                </td>
                   
            </tr>
            <tr>
                <td><label>City where attended:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>Type Of Institution:</label></td>
                <td>
                    <select>
                        <option>University</option>
                        <option>Polytechnic</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>please enter name of institution:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>institution website:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>Additional Comment:</label></td>
                <td><textarea rows="10" cols="10"></textarea></td>
            </tr>
            <tr>
                <td><label>select country:</label></td>
                <td>
                    <select>
                      <option>Nigeria</option>
                      <option>Ethopia</option>
                      <option>Chad</option>  
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Main Course of Study:</label></td>
                <td>
                    <select>
                        <option>chemical engineering</option>
                        <option>civil engineering</option>
                        <option>SLT</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>Field of Study:</label></td>
                <td>
                    <select>
                        <option>engineering</option>
                        <option>mathematics</option>
                        <option>law</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label>specialization:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label>Enrollment Satus:</label></td>
                <td>
                    <label>Full Time</label>
                    <input type="radio">
                    <label>Part Time</label>
                    <input type="radio">
                </td>
            </tr>
            <tr>
                <td><label>Teaching Method:</label></td>
                <td>
                    <select>
                        <option>Discussion Method</option>
                        <option>Lecture Method</option>
                        <option>Practical Method</option>
                        <option>Group Work Method</option>
                    </select>
                </td>
            </tr>
        
            
    </form>
           
               
</body>
</html>
